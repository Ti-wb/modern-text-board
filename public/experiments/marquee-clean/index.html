<!doctype html>
<html lang="zh-Hant" data-clean-marquee-state="booting">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Clean Marquee</title>
    <link
      rel="stylesheet"
      href="./marquee-clean.css"
    />
  </head>
  <body>
    <main
      aria-labelledby="clean-marquee-semantic-text"
      class="clean-marquee"
      data-clean-marquee-engine="css"
      id="clean-marquee"
    >
      <div aria-hidden="true" class="clean-marquee__copy" data-copy="primary">
        <span class="clean-marquee__text"></span>
      </div>
      <div aria-hidden="true" class="clean-marquee__copy" data-copy="secondary">
        <span class="clean-marquee__text"></span>
      </div>
      <p class="clean-marquee__semantic" id="clean-marquee-semantic-text"></p>
      <noscript>JavaScript is required once to measure the marquee geometry.</noscript>
    </main>
    <script defer src="./marquee-clean.js"></script>
  </body>
</html>
